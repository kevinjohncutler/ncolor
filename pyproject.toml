[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "ncolor"
requires-python = ">=3.11"
dynamic = ["version", "description", "readme", "authors", "classifiers", "dependencies", "optional-dependencies", "license"]

[project.scripts]
# Add entry point if any; otherwise, leave empty
# ncolor = "ncolor.__main__:main"

[tool.setuptools_scm]
write_to = "src/ncolor/_version.py"
# Avoid date-stamped local versions (post-commit dev tags) in built wheels —
# PyPI rejects "+local" version suffixes anyway.
local_scheme = "no-local-version"

[tool.cibuildwheel]
# Supported stable CPython versions. Bump as new ones land / EOLs roll off.
# Python 3.10 dropped in v2.0 — it reached EOL on 2025-10-31 and the
# ecosystem (NumPy 2.3+, SciPy) has already moved on. 3.15 wheels are
# built ahead of its October 2026 final so the release day has wheels.
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
# Skip musl Linux (no numba wheel for musllinux at time of writing).
skip = ["*-musllinux*"]
# build is the modern PEP 517 frontend (replaces legacy setup.py bdist_wheel).
build-frontend = "build"
# Build-time env: skip the SMT calibration (the cache it writes is host-
# specific and would bake the build-host's calibration into the wheel),
# and turn off -march=native so wheels are portable across CPU vintages.
# x86_64 wheels get an explicit x86-64-v2 target below.
environment = { NCOLOR_NO_CALIBRATE = "1", NCOLOR_MARCH_NATIVE = "0" }
# Smoke-test each wheel inside the cibuildwheel container.
# scipy / scikit-image / fastremap / shapely are pulled in so the
# parity-vs-skimage and the geo tests actually run on every wheel build
# (they auto-skip without these deps).
test-requires = ["pytest", "scipy", "scikit-image", "fastremap", "shapely"]
test-command = "pytest -q {project}/tests"

[tool.cibuildwheel.macos]
# Match the floor in setup.py's -mmacosx-version-min so the wheel tag and
# the actual binary agree.
environment = { NCOLOR_NO_CALIBRATE = "1", NCOLOR_MARCH_NATIVE = "0", MACOSX_DEPLOYMENT_TARGET = "10.14" }

# x86_64 Linux: x86-64-v2 (SSE4.2 / POPCNT, CPUs from 2009 on) is the
# same floor NumPy 2 assumes, and it enables the SSE4.1 lane multiply in
# the expand kernel. aarch64 has NEON unconditionally and needs nothing.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
environment = { NCOLOR_NO_CALIBRATE = "1", NCOLOR_MARCH_NATIVE = "0", NCOLOR_MARCH = "x86-64-v2" }

# The parity-test dependencies have no cp315 wheels yet; the parity and
# geo tests skip themselves without them, so test the core alone there.
[[tool.cibuildwheel.overrides]]
select = "cp315-*"
test-requires = ["pytest"]

# Windows ARM64 has no shapely wheel either: pip tries to compile it and
# fails in the cibuildwheel test venv, which failed every win_arm64 job
# before a single ncolor test ran. Same remedy: test the core alone.
[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
test-requires = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_files"]

[tool.coverage.run]
# Measure only the tracked package modules. _version.py is autogenerated
# by setuptools_scm, and the label_current/label_experimental_* files are
# untracked scratch/debug code, not part of the shipped package.
source = ["ncolor"]
omit = [
    "*/_version.py",
    "*/label_current.py",
    "*/label_experimental_*.py",
]
branch = false
parallel = true

[tool.coverage.paths]
# Map per-host checkout roots back to the canonical src/ncolor so
# coverage combine can merge .coverage data collected on multiple
# machines (e.g. via scripts/coverage_cross_device.sh). The wildcard
# entries cover the common cases: a Unix-style absolute path ending
# in ``/ncolor/src/ncolor`` (works for both macOS and Linux), and a
# Windows path with backslash separators.
source = [
    "src/ncolor",
    "*/ncolor/src/ncolor",
    "*\\ncolor\\src\\ncolor",
]

[tool.coverage.report]
show_missing = true