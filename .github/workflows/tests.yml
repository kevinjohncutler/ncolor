name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.os }} Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor and ceiling of supported CPython range (see pyproject.toml).
        python-version: ["3.11", "3.14"]
        include:
          # Next CPython, on one OS, with the core deps only: the parity
          # and geo tests skip themselves while scikit-image / fastremap
          # / shapely have no wheels for it. Drop the prerelease flag
          # and the minimal marker once it is final and they do.
          - os: ubuntu-latest
            python-version: "3.15"
            minimal: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.minimal == true }}

      - name: Install package + test deps
        env:
          NCOLOR_NO_CALIBRATE: "1"
          NCOLOR_MARCH_NATIVE: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build pytest pytest-cov
          python -m pip install -e .

      - name: Install optional test deps
        if: ${{ !matrix.minimal }}
        # scipy / scikit-image / fastremap back the parity tests (the
        # cpp output is checked against a scipy or skimage reference);
        # shapely + geopandas exercise ncolor.geo. The shipped wheel
        # needs none of them at runtime.
        run: python -m pip install scipy scikit-image fastremap shapely geopandas

      - name: Run tests
        run: pytest -q --cov=ncolor --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage + junit
        # One cell is enough; keep it on the ceiling Python so the
        # condition stays true when the floor moves.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
